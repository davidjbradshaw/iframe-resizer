<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://iframe-resizer.com/favicon.ico" />
    <title>iFrame message passing test</title>
    <meta name="description" content="iFrame message passing test" />
    <meta name="viewport" content="width=device-width" />
    <style>
      iframe {
        width: 48%;
        height: 100vh;
        /* border-width: 0; */
      }

      .message-data {
        margin-top: 20px;
        padding: 16px;
        background: #f5f5f5;
        border-radius: 4px;
      }

      .message-data h3 {
        margin: 0 0 8px;
      }

      .message-data pre {
        margin: 0;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <h2>Automagically resizing iFrame</h2>
    <p>
      Resize window or click one of the links in the iFrame to watch it resize.
      Or go back to a
      <a name="anchorParentTest" href="index.html">single iFrame</a>.
    </p>
    <div style="margin: 20px; overflow: auto">
      <iframe
        src="child/frame.content.html"
        scrolling="no"
        style="float: left; margin-right: 2%"
      ></iframe>
      <iframe
        src="child/frame.content.html"
        scrolling="no"
      ></iframe>
    </div>

    <div class="message-data" id="event-display" style="display: none">
      <h3>Event Data:</h3>
      <pre id="event-data"></pre>
    </div>
    <div style="margin: 8px 0; font-size: 13px">
      For details on how this works, see
      <a href="https://iframe-resizer.com">https://iframe-resizer.com</a>.
    </div>

    <script
      type="text/javascript"
      src="../../js-dist/iframe-resizer.parent.js"
    ></script>
    <script type="text/javascript">
      /*
       * If you do not understand what the code below does, then please just use the
       * following call in your own code.
       *
       *   iframeResize({ license: 'YOUR-LICENSE' })
       *
       */

      const display = document.getElementById('event-display')
      const eventData = document.getElementById('event-data')

      function showData(data) {
        display.style.display = ''
        eventData.textContent = JSON.stringify(
          data,
          (key, value) => (key === 'iframe' ? undefined : value),
          2,
        )
      }

      const iframes = iframeResize({
        inPageLinks: true, // Enable in page links
        license: 'GPLv3',

        onResized(messageData) {
          // Callback fn when resize is received
          showData(messageData)
        },
        onMessage(messageData) {
          // Callback fn when message is received
          showData(messageData)
          alert(`${messageData.message} (${messageData.iframe.id})`)
        },
        onAfterClose(id) {
          // Callback fn when iFrame is closed
          showData({ id, type: 'close' })
        },
      })
    </script>
  </body>
</html>
