<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mutation backlog while rAF is paused</title>
    <style>
      /* Tall page: scrolling to the bottom puts the iframe offscreen */
      body {
        margin: 0;
        height: 8000px;
      }
      iframe {
        width: 100%;
        height: 100px;
        border: 0;
      }
    </style>
    <script src="/js/iframe-resizer.parent.js"></script>
  </head>
  <body>
    <!-- Cross-origin child (127.0.0.1 vs localhost): Chromium pauses rAF
         in cross-origin iframes that are not in the viewport -->
    <iframe id="child"></iframe>
    <script>
      // ?bare loads the same child page without the child script, as a
      // control showing the browser itself does not retain the records
      const bare = location.search.includes('bare')
      const iframe = document.getElementById('child')
      iframe.src = `http://127.0.0.1:${location.port}/e2e/fixtures/child/frame.mutation-backlog${bare ? '-bare' : ''}.html`
      // log: false so no console message (and no Playwright console handle)
      // can hold a reference to the removed nodes
      if (!bare) iframeResize({ license: 'GPLv3', log: false }, iframe)
    </script>
  </body>
</html>
