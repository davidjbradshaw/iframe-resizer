<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Title observer parent</title>
    <script src="/js/iframe-resizer.parent.js"></script>
    <style>
      iframe { width: 100%; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <!-- No title attribute, so syncTitle is on and the child's title is copied -->
    <iframe id="child" scrolling="no"></iframe>
    <script>
      const child = new URLSearchParams(location.search).get('child')
      const iframe = document.getElementById('child')
      iframe.src = `/e2e/fixtures/child/${child}`
      iframeResize({ license: 'GPLv3', log: true }, iframe)
    </script>
  </body>
</html>
