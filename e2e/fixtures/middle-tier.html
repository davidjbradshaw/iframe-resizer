<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer middle tier test</title>
    <style>
      iframe {
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- The middle page is both sized by this page and a host itself -->
    <iframe id="middle" src="child/frame.middle-tier.html"></iframe>

    <script src="../../js/iframe-resizer.parent.js"></script>
    <script>
      window.ready = false

      iframeResize(
        {
          license: 'GPLv3',
          onReady: () => {
            window.ready = true
          },
        },
        '#middle',
      )
    </script>
  </body>
</html>
