<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Body replace parent</title>
    <style>
      iframe {
        width: 100%;
        height: 100px;
        border: 0;
      }
    </style>
    <script src="/js/iframe-resizer.parent.js"></script>
  </head>
  <body>
    <iframe id="child" src="/e2e/fixtures/child/frame.body-replace.html"></iframe>
    <script>
      window.resized = []
      iframeResize(
        {
          license: 'GPLv3',
          onResized(data) {
            window.resized.push({ type: data.type, height: data.height })
          },
        },
        document.getElementById('child'),
      )
    </script>
  </body>
</html>
