<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 30 child</title>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }

      // Counts animation frames, so the test can see whether rAF is running
      window.rafTicks = 0
      const tick = () => {
        window.rafTicks++
        requestAnimationFrame(tick)
      }
      requestAnimationFrame(tick)

      // A live feed update: replace a list item subtree, then drop every
      // reference to the removed one except a WeakRef the test can check.
      window.removedRefs = []
      window.feedUpdate = (size) => {
        const item = document.createElement('div')
        item.className = 'feed-item'
        for (let i = 0; i < size; i++) {
          const row = document.createElement('p')
          row.textContent = `row ${i} ${'x'.repeat(100)}`
          item.append(row)
        }
        const feed = document.getElementById('feed')
        feed.append(item)
        feed.removeChild(item)
        window.removedRefs.push(new WeakRef(item))
      }

      // How many removed subtrees are still reachable after a GC
      window.aliveCount = () =>
        window.removedRefs.filter((ref) => ref.deref() !== undefined).length
    </script>
    <script src="/js/iframe-resizer.child.js"></script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <div id="feed"></div>
  </body>
</html>
