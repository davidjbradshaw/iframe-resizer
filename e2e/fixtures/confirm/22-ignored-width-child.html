<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Finding 22 child</title>
    <script type="text/javascript" src="/js/iframe-resizer.child.js"></script>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
    </script>
    <style>
      /* The body shrink-wraps its content and positions the off-canvas nav,
         so the nav's right edge is always 300px past the body's right edge */
      body { margin: 8px; font-family: sans-serif; width: max-content; position: relative; }
      nav { position: absolute; top: 0; left: 100%; width: 300px; background: salmon; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <p id="content">Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    <nav data-iframe-ignore id="menu">Off-canvas menu that should be ignored</nav>
  </body>
</html>
