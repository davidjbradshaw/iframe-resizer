<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 16.2 child</title>
    <style>
      body { margin: 8px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <p>Child content</p>
    <script>
      // Load the child script late, so the parent has time to change an
      // option before the child initialises
      setTimeout(() => {
        const script = document.createElement('script')
        script.src = '/js/iframe-resizer.child.js'
        document.body.appendChild(script)
      }, 1500)
    </script>
  </body>
</html>
