<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 24 Child</title>
    <script type="text/javascript" src="/js/iframe-resizer.child.js"></script>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
      // Called by the test: an unrelated element is added that overflows the
      // bottom of the page (like a dropdown opening)
      window.showFooter = () => {
        const footer = document.createElement('div')
        footer.id = 'footer'
        footer.textContent = 'Footer'
        document.body.append(footer)
      }
    </script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
      /* A fixed-width child wider than its fixed-width parent: it sticks out
         to the right without growing the body's max-content width */
      #outer { width: 200px; background: wheat; }
      #inner { width: 800px; height: 40px; background: rgb(135, 248, 180); }
      /* Narrow, and only overflows the bottom edge of the page */
      #footer {
        position: absolute;
        top: 1000px;
        left: 0;
        width: 100px;
        height: 50px;
        background: pink;
      }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <div id="outer"><div id="inner">Wide content</div></div>
  </body>
</html>
