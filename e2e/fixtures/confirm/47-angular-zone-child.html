<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 47 child</title>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
      // Each call grows the content by 50px, so the child sends one resize
      window.grow = () => {
        const box = document.getElementById('box')
        box.style.height = `${box.offsetHeight + 50}px`
        return box.offsetHeight
      }
    </script>
    <script src="/js/iframe-resizer.child.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #box { height: 100px; background: #cde; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <div id="box"></div>
  </body>
</html>
