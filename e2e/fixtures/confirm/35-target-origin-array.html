<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 35: array targetOrigin in the child</title>
    <style>
      body { margin: 0; padding: 16px; font-family: sans-serif; }
      iframe { width: 100%; border: 1px solid #999; }
    </style>
  </head>
  <body>
    <h1>Finding 35: child posts to every listed targetOrigin</h1>
    <p>Status: <span id="status">pending</span></p>
    <!-- Cross-origin child: 127.0.0.1 vs localhost, so postMessage is used -->
    <iframe
      id="frame"
      src="http://127.0.0.1:8080/e2e/fixtures/confirm/35-target-origin-array-child.html"
    ></iframe>
    <script src="/js/iframe-resizer.parent.js"></script>
    <script>
      window.childReady = false
      window.resizeCount = 0
      iframeResize(
        {
          license: 'GPLv3',
          checkOrigin: false,
          onReady() {
            window.childReady = true
            document.getElementById('status').textContent = 'ready'
          },
          onResized() {
            window.resizeCount += 1
          },
        },
        '#frame',
      )
    </script>
  </body>
</html>
