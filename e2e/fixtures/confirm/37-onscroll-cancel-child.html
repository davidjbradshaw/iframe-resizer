<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 37 child</title>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
    </script>
    <script type="text/javascript" src="/js/iframe-resizer.child.js"></script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <!-- #section does not exist in this document, so the child forwards
         the link to the parent, which finds it in its own page -->
    <p><a id="link" href="#section">Go to parent section</a></p>
  </body>
</html>
