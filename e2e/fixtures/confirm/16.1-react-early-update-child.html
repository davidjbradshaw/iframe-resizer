<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 16.1 Child</title>
    <script>
      // Hold off loading the child script until the parent says the option
      // change has been applied, so INIT always comes after the change
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
      window.addEventListener('message', (event) => {
        if (event.data !== '16.1:go') return
        const script = document.createElement('script')
        script.src = '/js/iframe-resizer.child.js'
        document.head.appendChild(script)
      })
      window.addEventListener('load', () => {
        window.parent.postMessage('16.1:loaded', '*')
      })
    </script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
      #box { width: 250px; border: 1px solid #999; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <div id="box">A box narrower than the iframe.</div>
  </body>
</html>
