<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 35 child</title>
    <script>
      // Two allowed parent origins; only the first matches where this page
      // is actually embedded (http://localhost:8080)
      window.iframeResizer = {
        targetOrigin: ['http://localhost:8080', 'https://b.example'],
        // A content change after init, so the child sends a second size
        onMessage() {
          const block = document.createElement('div')
          block.style.height = '200px'
          block.textContent = 'grown'
          document.body.append(block)
        },
      }
    </script>
    <script src="/js/iframe-resizer.child.js"></script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <p>Child content</p>
  </body>
</html>
