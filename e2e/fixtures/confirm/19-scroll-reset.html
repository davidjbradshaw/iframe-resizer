  <body>
    <h2>Confirm 19</h2>

    <div style="margin: 20px">
      <iframe
        src="/e2e/fixtures/confirm/19-scroll-reset-child.html"
        style="width: 400px; height: 200px"
      ></iframe>

    <script type="text/javascript">
      iframeResize({
        license: 'GPLv3',
        log: true,
        direction: 'horizontal-inline',
        scrolling: true,
      })
    </script>
