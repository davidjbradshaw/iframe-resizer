<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 55: options set to undefined</title>
    <script type="text/javascript" src="/js/iframe-resizer.web-component.js"></script>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      iframe {
        width: 400px;
        border: 1px solid #ccc;
      }
    </style>
  </head>

  <body>
    <p>Ready events: <span id="ready-count">0</span></p>
    <div id="host"></div>

    <script type="text/javascript">
      window.readyEvents = []
      window.resizedEvents = []

      // Mirror what a framework does for an unset binding: `options` is an
      // accessor on the prototype, so `'options' in el` is true and the
      // framework assigns the binding's value, undefined, as a property.
      const el = document.createElement('iframe-resizer')
      el.setAttribute('license', 'GPLv3')
      el.setAttribute('log', '')
      el.setAttribute('src', '/e2e/fixtures/child/frame.fluid.html')
      el.options = undefined

      el.addEventListener('iframe-resizer:ready', (event) => {
        window.readyEvents.push(event.detail?.iframe?.id ?? 'ready')
        document.getElementById('ready-count').textContent = String(
          window.readyEvents.length,
        )
      })
      el.addEventListener('iframe-resizer:resized', (event) => {
        window.resizedEvents.push(event.detail?.height ?? 'resized')
      })

      document.getElementById('host').append(el)
    </script>
  </body>
</html>
