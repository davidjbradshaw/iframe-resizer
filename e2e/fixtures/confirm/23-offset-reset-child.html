<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 23 child: offsetSize and reset</title>
    <script>
      window.iframeResizer = {
        offsetSize: 50,
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
    </script>
    <script type="text/javascript" src="/js/iframe-resizer.child.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #content {
        height: 400px;
        box-sizing: border-box;
        background: #eef;
      }
    </style>
  </head>
  <body>
    <!-- The page is exactly 400px tall, so with offsetSize 50 the iframe
         should always be 450px -->
    <div id="content">Ready: <span id="ready-status">pending</span></div>
  </body>
</html>
