<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confirm 19 child</title>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
    </script>
    <script type="text/javascript" src="/js/iframe-resizer.child.js"></script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
      #tall { height: 2000px; background: linear-gradient(#eee, #999); }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <!-- Stands in for a clock or carousel: the test appends a node here to
         raise a childList mutation that does not change the page size -->
    <div id="log"></div>
    <div id="tall" data-iframe-resize>Tall content so the iframe scrolls.</div>
  </body>
</html>
