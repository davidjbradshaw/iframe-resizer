<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer jQuery detached iframe test</title>
    <style>
      iframe {
        width: 100%;
        border: 0;
      }
    </style>
    <script src="/node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../../js/iframe-resizer.jquery.js"></script>
  </head>
  <body>
    <script>
      // The iframe is bound before it is added to the page. ?src= sets the
      // child page, which is on this origin by default.
      const src =
        new URLSearchParams(window.location.search).get('src') ??
        'child/frame.content.html'

      window.readyCount = 0

      $('<iframe id="myIframe">')
        .attr('src', src)
        .iframeResize({
          license: 'GPLv3',
          log: true,
          onReady: () => {
            window.readyCount += 1
          },
        })
        .appendTo('body')
    </script>
  </body>
</html>
