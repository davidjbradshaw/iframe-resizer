<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer sendMessage test</title>
    <style>
      iframe {
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="myIframe"></iframe>
    <script src="../../js/iframe-resizer.parent.js"></script>
    <script>
      // ?src= sets the child page, to load it from another origin, and
      // ?checkOrigin= the one origin stored for messages to go to
      const params = new URLSearchParams(window.location.search)
      const iframe = document.getElementById('myIframe')
      iframe.src = params.get('src') ?? 'child/frame.messages.html'
      const checkOrigin = params.get('checkOrigin')

      window.ready = false
      iframeResize(
        {
          license: 'GPLv3',
          checkOrigin: checkOrigin ? [checkOrigin] : false,
          onReady: () => {
            window.ready = true
          },
        },
        iframe,
      )

      window.send = (message, targetOrigin) =>
        iframe.iframeResizer.sendMessage(message, targetOrigin)
    </script>
  </body>
</html>
