<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer legacy parent</title>
    <style>
      iframe {
        width: 100%;
        border: 0;
      }
    </style>
    <script>
      // ?parent=v1..v5 loads that release's parent script, else the current
      // one; ?child=v1..v5 does the same for the page in the iframe
      const query = new URLSearchParams(location.search)
      window.parentVersion = query.get('parent')
      window.childVersion = query.get('child')

      const scripts = {
        v1: [
          '/node_modules/jquery/dist/jquery.min.js',
          'legacy/v1/jquery.iframeResizer.js',
        ],
        v2: ['legacy/v2/iframeResizer.js'],
        v3: ['legacy/v3/iframeResizer.js'],
        v4: ['legacy/v4/iframeResizer.js'],
        v5: ['legacy/v5/iframeResizer.js'],
      }[window.parentVersion] ?? ['../../js/iframe-resizer.parent.js']

      for (const src of scripts) {
        document.write(`<script src="${src}"><\/script>`)
      }
    </script>
  </head>
  <body>
    <iframe id="legacy" scrolling="no"></iframe>
    <!-- Room to scroll, and an anchor for in-page links to the parent page -->
    <div style="height: 2000px"></div>
    <div id="parent-anchor">Parent anchor</div>
    <div style="height: 2000px"></div>
    <script>
      // What the child sends, for the API tests
      window.received = []
      window.resized = 0
      window.mouse = []
      const onMessage = ({ message }) => window.received.push(message)
      const onResized = () => {
        window.resized += 1
      }
      const onMouse = (type) => () => window.mouse.push(type)

      // A parent before v5 sends no license, so the child page sets it
      const childQuery = new URLSearchParams()
      if (window.childVersion) childQuery.set('child', window.childVersion)
      if (['v1', 'v2', 'v3', 'v4'].includes(window.parentVersion)) {
        childQuery.set('license', 'GPLv3')
      }
      document.getElementById('legacy').src =
        `child/frame.legacy.html?${childQuery}`

      // Each release's own way of binding an iframe, with its callback names
      const mouse = {
        onMouseEnter: onMouse('enter'),
        onMouseLeave: onMouse('leave'),
      }
      switch (window.parentVersion) {
        case 'v1':
          window.jQuery('#legacy').iFrameResize({})
          break

        case 'v2':
          window.iFrameResize(
            { messageCallback: onMessage, resizedCallback: onResized },
            '#legacy',
          )
          break

        case 'v3':
          window.iFrameResize(
            {
              inPageLinks: true,
              messageCallback: onMessage,
              resizedCallback: onResized,
            },
            '#legacy',
          )
          break

        case 'v4':
          window.iFrameResize(
            { inPageLinks: true, onMessage, onResized, ...mouse },
            '#legacy',
          )
          break

        default:
          window.iframeResize(
            {
              license: 'GPLv3',
              inPageLinks: true,
              onMessage,
              onResized,
              ...mouse,
            },
            '#legacy',
          )
      }
    </script>
  </body>
</html>
