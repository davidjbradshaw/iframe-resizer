<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nested wrapper</title>
    <!-- Stands in for the iframe Google Apps Script wraps an app in: it has
         no iframe-resizer of its own, and its iframe fills it -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe src="child/frame.gas.html"></iframe>
  </body>
</html>
