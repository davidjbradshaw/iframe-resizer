<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer reset test</title>
    <style>
      iframe {
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="resetIframe" src="child/frame.reset.html"></iframe>

    <script src="../../js/iframe-resizer.parent.js"></script>
    <script>
      window.ready = false

      iframeResize(
        {
          license: 'GPLv3',
          onReady: () => {
            window.ready = true
          },
        },
        '#resetIframe',
      )
    </script>
  </body>
</html>
