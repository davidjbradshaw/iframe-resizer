<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Iframe-Resizer Examples</title>
    <meta name="description" content="iFrame message passing test" />
    <meta name="viewport" content="width=device-width" />
    <style>
      a.toggle {
        float: right;
        margin-left: 8px;
      }
      #callback {
        margin: -5px 0 5px 24px;
      }

      iframe {
        width: 100%;
        height: 100vh;
        /* border-width: 0; */
      }

    </style>
    <script
      type="text/javascript"
      src="/node_modules/jquery/dist/jquery.min.js"
    ></script>
    <script
      type="text/javascript"
      src="../../js/iframe-resizer.jquery.js"
    ></script>
    <script src="../shared/record.js"></script>
  </head>

  <body>
    <h2>Automagically resizing iFrame</h2>
    <p>
      Resize window or click one of the links in the iFrame to watch it resize.
      Or try with <a name="anchorParentTest" href="two.html">two iFrames</a>.
    </p>

    <!-- Option changes applied after init by the e2e tests, one button per
         step, as the framework apps have -->
    <button id="update-styles">Update styles</button>
    <button id="update-offset">Update offset</button>
    <button id="update-tolerance">Update tolerance</button>
    <button id="update-links">Update links</button>
    <button id="update-direction">Update direction</button>

    <div id="iframeContainer" style="margin: 20px">
      <iframe
        src="child/frame.test.html"
        scrolling="no"
      ></iframe>
    </div>

    <p id="callback"></p>
    <div style="margin: 8px 0 0 24px; font-size: 13px">
      For details on how this works, see
      <a href="https://iframe-resizer.com">https://iframe-resizer.com</a>.
    </div>

    <script type="text/javascript">
      /*
       * If you do not understand what the code below does, then please just use the
       * following call in your own code.
       *
       *   $('iframe').iframeResize({ license: 'YOUR-LICENSE' })
       *
       */

      const callbackDisplay = document.querySelector('p#callback')

      $('iframe').iframeResize({
        inPageLinks: true,
        license: 'GPLv3',
        log: true,
        waitForLoad: true,

        onReady() {
          record('onReady')
        },

        onResized(messageData) {
          // Callback fn when resize is received
          record('onResized', { type: messageData.type })
          callbackDisplay.innerHTML =
          `<b>Frame ID:</b> ${messageData.iframe.id} <br><b>Height:</b> ${messageData.height} <br><b>Width:</b> ${messageData.width} <br><b>Event type:</b> ${messageData.type}`
        },

        onMouseEnter(messageData) {
          // Callback fn when mouse enters iframe
          callbackDisplay.innerHTML = `<b>Frame ID:</b> ${messageData.iframe.id} <br><b>ScreenX:</b> ${messageData.screenX} <br><b>ScreenY:</b> ${messageData.screenY} <br><b>Event type:</b> ${messageData.type}`
        },

        onMouseLeave(messageData) {
          // Callback fn when mouse enters iframe
          callbackDisplay.innerHTML = `<b>Frame ID:</b> ${messageData.iframe.id} <br><b>ScreenX:</b> ${messageData.screenX} <br><b>ScreenY:</b> ${messageData.screenY} <br><b>Event type:</b> ${messageData.type}`
        },

        onMessage(messageData) {
          // Callback fn when message is received
          record('onMessage', { message: messageData.message })
          callbackDisplay.innerHTML = `<b>Frame ID:</b> ${messageData.iframe.id} <br><b>Message:</b> ${messageData.message}`
          alert(messageData.message)
          messageData.iframe.iframeResizer.sendMessage(
            'Hello back from parent page',
          )
        },

        onAfterClose(id) {
          // Callback fn when iFrame is closed
          callbackDisplay.innerHTML = `<b>Iframe (</b>${id}<b>) removed from page.</b>`
        },

        onScroll(messageData) {
          // Callback fn when iframe is scrolled
          record('onScroll')
          callbackDisplay.innerHTML = `<b>Iframe ID:</b> ${messageData.iframe.id} <br><b>Top:</b> ${messageData.top} <br><b>Left:</b> ${messageData.left}`
        },
      })
    </script>
    <script type="module">
      import { updates } from '../shared/app.js'

      // Applied one step at a time by calling the plugin again, which is how
      // a jQuery page updates its options
      for (const [step, options] of Object.entries(updates(location.origin))) {
        $(`#update-${step}`).on('click', () => {
          $('iframe').iframeResize({ license: 'GPLv3', ...options })
        })
      }
    </script>
  </body>
</html>
