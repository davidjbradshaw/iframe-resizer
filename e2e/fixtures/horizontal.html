<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer horizontal e2e</title>
    <script type="text/javascript" src="../../dist/parent/index.umd.js"></script>
  </head>

  <body>
    <h2>Horizontal resizing</h2>
    <p>Child page: <code id="child-name"></code></p>

    <div id="iframeContainer" style="margin: 20px">
      <iframe scrolling="no" style="width: 400px; height: 200px"></iframe>
    </div>

    <script type="text/javascript">
      // The child page is chosen with ?child=<file>, default fluid content
      const child =
        new URLSearchParams(location.search).get('child') || 'frame.fluid.html'
      document.getElementById('child-name').textContent = child
      document.querySelector('iframe').src = `child/${child}`

      iframeResize({
        license: 'GPLv3',
        log: true,
        direction: 'horizontal',
      })
    </script>
  </body>
</html>
