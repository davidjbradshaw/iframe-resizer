<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer legacy child</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #content {
        height: 300px;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div id="content">
      Content
      <div id="child-anchor" style="margin-top: 200px">Child anchor</div>
    </div>
    <script>
      // ?child=v1..v5 loads that release's child script, else the current
      // one. ?license= sets the license here, as a parent before v5 sends none.
      const query = new URLSearchParams(location.search)
      const child = query.get('child')

      // What the parent sends, under each release's own config and name
      window.received = []
      const onMessage = (message) => window.received.push(message)
      const license = query.has('license') ? { license: query.get('license') } : {}
      if (child === 'v3') window.iFrameResizer = { messageCallback: onMessage }
      else if (child === 'v4') window.iFrameResizer = { onMessage }
      else window.iframeResizer = { ...license, onMessage }

      const src = child
        ? `../legacy/${child}/iframeResizer.contentWindow.js`
        : '../../../js/iframe-resizer.child.js'
      document.write(`<script src="${src}"><\/script>`)

      window.grow = () => {
        document.getElementById('content').style.height = '500px'
      }
    </script>
  </body>
</html>
