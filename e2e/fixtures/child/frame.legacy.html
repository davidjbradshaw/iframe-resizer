<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer legacy child</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #content {
        height: 300px;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div id="content">Content</div>
    <script>
      // ?child=v1..v5 loads that release's child script, else the current
      // one. ?license= sets the license here, as a parent before v5 sends none.
      const query = new URLSearchParams(location.search)
      const child = query.get('child')
      if (query.has('license')) {
        window.iframeResizer = { license: query.get('license') }
      }
      const src = child
        ? `../legacy/${child}/iframeResizer.contentWindow.js`
        : '../../../js/iframe-resizer.child.js'
      document.write(`<script src="${src}"><\/script>`)

      window.grow = () => {
        document.getElementById('content').style.height = '500px'
      }
    </script>
  </body>
</html>
