<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer reset child</title>
    <script>
      // 800px of content, which onBeforeResize holds to 500px
      window.iframeResizer = {
        onBeforeResize: (size, event, direction) =>
          direction === 'height' ? Math.min(size, 500) : size,
      }
    </script>
    <script src="/js/iframe-resizer.child.js"></script>
    <style>
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div style="height: 800px">Content taller than the limit</div>
  </body>
</html>
