<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Scroll position child</title>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
    </script>
    <script type="text/javascript" src="/js/iframe-resizer.child.js"></script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
      #tall { height: 2000px; background: linear-gradient(#eee, #999); }
      #log .block { display: block; height: 100px; background: wheat; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <div id="tall">Tall content so the iframe scrolls.</div>
    <!-- Stands in for a clock or a feed: the test appends nodes here, below
         what the user is looking at, with or without a change of size -->
    <div id="log"></div>
  </body>
</html>
