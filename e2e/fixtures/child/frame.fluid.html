<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>E2E Fluid Child</title>
    <script type="text/javascript" src="/js/iframe-resizer.child.js"></script>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
    </script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <!-- Nothing here has a width of its own: every element stretches to fill
         the body, so the tagged block is exactly as wide as the iframe less
         the body margin -->
    <p>Ready: <span id="ready-status">pending</span></p>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
    <div data-iframe-resize>A block that is as wide as its container.</div>
  </body>
</html>
