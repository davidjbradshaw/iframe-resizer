<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>First Title</title>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
    </script>
    <script src="/js/iframe-resizer.child.js"></script>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <script>
      // Swap the <title> element the way an SPA head manager does on
      // client-side navigation: remove the old element, insert a new one.
      window.swapTitle = (text) => {
        document.querySelector('title').remove()
        const title = document.createElement('title')
        title.textContent = text
        document.head.appendChild(title)
      }
    </script>
  </body>
</html>
