<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>E2E Animation Child</title>
    <script type="text/javascript" src="/dist/child/index.umd.js"></script>
    <style>
      html { margin: 0; padding: 0; }
      body { margin: 8px; font-family: sans-serif; }
      #box { background: wheat; height: 150px; overflow: hidden; }

      /* ?mode=height: the box is in the flow, so the page grows with it */
      #box.height { animation: grow 2s linear infinite alternate; }

      /* ?mode=width: the box is out of the flow, as a fluid block would be
         as wide as the iframe and give the page no width of its own */
      #box.width {
        position: absolute;
        top: 30px;
        left: 8px;
        animation: widen 2s linear infinite alternate;
      }

      @keyframes grow {
        from { height: 150px; }
        to { height: 800px; }
      }

      @keyframes widen {
        from { width: 200px; }
        to { width: 700px; }
      }
    </style>
  </head>
  <body>
    <b>Animated content</b>
    <div id="box">Animated by CSS keyframes</div>

    <script>
      const mode = new URLSearchParams(location.search).get('mode') || 'height'
      const box = document.getElementById('box')
      box.classList.add(mode)

      // Out of the flow the box has to be named as the content to measure.
      // In the flow it must not be: a tagged element is measured to its own
      // edge, which leaves out the body margin below it.
      if (mode === 'width') box.dataset.iframeResize = ''

      // The browser reports a resize it could not deliver in the same pass as
      // an error event, not an exception; pass it up so the test can see it
      window.addEventListener('error', (e) => {
        if (/ResizeObserver loop/.test(e.message)) {
          window.parent.stats.resizeObserverErrors += 1
        }
      })
    </script>
  </body>
</html>
