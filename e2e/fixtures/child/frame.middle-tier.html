<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Middle tier</title>
    <script src="/js/iframe-resizer.parent.js"></script>
    <script src="/js/iframe-resizer.child.js"></script>
    <style>
      iframe {
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h2>Middle tier</h2>
    <!-- localhost and 127.0.0.1 are different origins served by the same
         server, so the inner iframe talks to this page over postMessage -->
    <iframe
      id="inner"
      src="http://127.0.0.1:8080/e2e/fixtures/child/frame.content.html"
    ></iframe>

    <script>
      window.innerReady = false

      iframeResize(
        {
          license: 'GPLv3',
          onReady: () => {
            window.innerReady = true
          },
        },
        '#inner',
      )
    </script>
  </body>
</html>
