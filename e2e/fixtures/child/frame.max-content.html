<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>E2E Max-content Child</title>
    <script type="text/javascript" src="/js/iframe-resizer.child.js"></script>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
    </script>
    <style>
      /* The body shrink-wraps its content, so the page has a width of its
         own: the longest line of text, unwrapped */
      body { margin: 8px; font-family: sans-serif; width: max-content; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt.</p>
    <div data-iframe-resize>A block that is as wide as its container.</div>
  </body>
</html>
