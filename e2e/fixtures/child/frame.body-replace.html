<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Body replace child</title>
    <script>
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }

      // What Turbo Drive does on every navigation: swap the <body> element
      window.swapBody = () => {
        const newBody = document.createElement('body')
        newBody.innerHTML = document.body.innerHTML
        document.body.replaceWith(newBody)
      }

      // A content change that should resize the iframe
      window.grow = (px) => {
        const block = document.createElement('div')
        block.style.height = `${px}px`
        block.style.background = '#cde'
        block.textContent = `grown by ${px}px`
        document.body.append(block)
      }
    </script>
    <script src="/js/iframe-resizer.child.js"></script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
  </body>
</html>
