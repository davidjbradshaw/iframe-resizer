<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer getParentProps load child</title>
    <script>
      window.parentInfoCount = 0
      window.propsSubscribed = false
      window.subscribedAtReadyState = null

      // Subscribe as soon as the child is initialised. Init happens at
      // readyState 'interactive', before the slow image below finishes and
      // the iframe's load event fires, as a component mounting at
      // DOMContentLoaded would do.
      const poll = setInterval(() => {
        if (!('parentIframe' in window)) return
        clearInterval(poll)
        window.subscribedAtReadyState = document.readyState
        window.parentIframe.getParentProps(() => {
          window.parentInfoCount += 1
        })
        window.propsSubscribed = true
      }, 10)
    </script>
    <script src="/js/iframe-resizer.child.js"></script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <p>Child content</p>
    <!-- The test intercepts this request and holds it to delay the load event -->
    <img src="slow-image.png" alt="" width="10" height="10" />
  </body>
</html>
