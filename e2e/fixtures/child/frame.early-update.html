<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>E2E Early Update Child</title>
    <script>
      // Holds the child script back until the parent page says its option
      // change has been made, so the change always comes before init
      window.iframeResizer = {
        onReady() {
          document.getElementById('ready-status').textContent = 'ready'
        },
      }
      let started = false
      window.addEventListener('message', (event) => {
        if (event.data !== 'early-update:go' || started) return
        started = true
        const script = document.createElement('script')
        script.src = '/js/iframe-resizer.child.js'
        document.head.appendChild(script)
      })
      window.addEventListener('load', () => {
        window.parent.postMessage('early-update:loaded', '*')
      })
    </script>
    <style>
      body { margin: 8px; font-family: sans-serif; }
      #box { width: 250px; border: 1px solid #999; }
    </style>
  </head>
  <body>
    <p>Ready: <span id="ready-status">pending</span></p>
    <div id="box">A box narrower than the iframe.</div>
  </body>
</html>
