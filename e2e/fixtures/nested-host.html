<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer nested host test</title>
    <style>
      iframe {
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script src="../../js/iframe-resizer.parent.js"></script>
    <script>
      // The setup from the Google Apps Script guide: wait for the nested
      // page to say where it is, then talk to that window directly
      window.ready = false

      function startIframeResizer(event) {
        if (event.data !== 'gasFrame') return

        iframeResize(
          {
            license: 'GPLv3',
            checkOrigin: [event.origin],
            postMessageTarget: event.source,
            onReady: () => {
              window.ready = true
            },
          },
          '#wrapper',
        )

        window.removeEventListener('message', startIframeResizer)
      }

      window.addEventListener('message', startIframeResizer)
    </script>

    <!-- The wrapper is on another origin, and holds the page to be sized.
         After the scripts, so the nested page cannot say where it is before
         the listener and iframeResize() are there to hear it -->
    <iframe
      id="wrapper"
      src="http://127.0.0.1:8080/e2e/fixtures/nested-wrapper.html"
    ></iframe>
  </body>
</html>
