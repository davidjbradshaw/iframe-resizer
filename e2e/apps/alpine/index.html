<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpine E2E Test</title>
  </head>
  <body>
    <div
      x-data="{
        messageData: null,
        extra: {},
        updateOption() {
          // First click: styles and origin; second click: offsetSize alone
          this.extra = this.extra.bodyBackground
            ? { ...this.extra, offsetSize: 100 }
            : {
                bodyBackground: 'rgb(0, 128, 0)',
                bodyPadding: '6px',
                bodyMargin: 12,
                scrolling: true,
                checkOrigin: [location.origin],
              }
        },
        get iframeOptions() {
          const self = this
          return {
            license: 'GPLv3',
            log: true,
            inPageLinks: true,
            ...this.extra,
            onResized(data) { self.messageData = data },
            onMessage(data) {
              self.messageData = data
              alert('Message from frame ' + data.iframe.id + ': ' + data.message)
              data.iframe.iframeResizer.sendMessage('Hello back from the parent page')
            }
          }
        }
      }"
    >
      <h2>@iframe-resizer/alpine example</h2>
      <button id="update-option" @click="updateOption()">Update option</button>

      <iframe
        x-iframe-resizer="iframeOptions"
        id="myIframe"
        src="child/frame.test.html"
        style="width: 100%; height: 100vh"
      ></iframe>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
