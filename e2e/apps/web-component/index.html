<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Component E2E Test</title>
  </head>
  <body>
    <h2>@iframe-resizer/web-component example</h2>
    <button id="update-styles">Update styles</button>
    <button id="update-offset">Update offset</button>
    <button id="update-tolerance">Update tolerance</button>
    <button id="update-links">Update links</button>

    <iframe-resizer
      license="GPLv3"
      log
      inPageLinks
      id="myIframe"
      src="child/frame.test.html"
      style="width: 100%; height: 100vh"
    ></iframe-resizer>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      const el = document.querySelector('iframe-resizer')

      // Option changes applied after init by the e2e tests, one button per
      // step; each sets the matching attributes
      const UPDATES = {
        styles: {
          bodybackground: 'rgb(0, 128, 0)',
          bodypadding: '6px',
          bodymargin: '12',
          scrolling: '',
          // Two origins so the attribute parses as an array (a single value stays a string)
          checkorigin: location.origin + ' https://example.com',
        },
        offset: { offsetsize: '100' },
        tolerance: { tolerance: '1000' },
        links: { inpagelinks: 'false' },
      }

      for (const [step, attrs] of Object.entries(UPDATES)) {
        document.getElementById(`update-${step}`).addEventListener('click', () => {
          for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, value)
        })
      }

      el.addEventListener('iframe-resizer:message', (e) => {
        alert('Message from frame ' + e.detail.iframe.id + ': ' + e.detail.message)
        e.detail.iframe.iframeResizer.sendMessage('Hello back from the parent page')
      })
    </script>
  </body>
</html>
