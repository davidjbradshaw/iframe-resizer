<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>iframe-resizer late loaded child</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      #content {
        height: 275px;
      }
    </style>

    <script type="text/javascript">
      window.iframeResizer = {
        license: 'GPLv3',
        log: true,
      }
    </script>
  </head>

  <body>
    <div id="content"></div>

    <!--
      The child script arrives after the load event, by which time the parent
      has already sent an init to a page that could not answer it. The child
      then tells the parent it is ready, and the handshake starts again.
    -->
    <script type="text/javascript">
      window.addEventListener('load', () => {
        setTimeout(() => {
          const script = document.createElement('script')
          script.src = '/base/test/js/iframe-resizer.child.js'
          document.body.append(script)
        }, 300)
      })
    </script>
  </body>
</html>
