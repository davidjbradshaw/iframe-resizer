# Integration Tests Workflow
# Runs Jasmine/Karma integration tests for iframe-resizer

name: Jasmine

permissions:
  contents: read

on:
  push:
    branches: [ "master", "dev", "dev-review" ]
  pull_request:
    branches: [ "master", "dev", "dev-review" ]
  workflow_dispatch: # Allow manual trigger

# A newer commit to a PR cancels its older runs; each push runs in full
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration tests on Karma
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]
        # Single Node.js version is sufficient (browser-targeted)

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Use npm 12
      run: npm install -g npm@12

    - name: Install dependencies
      run: npm ci

    - name: Build test artifacts
      run: npm run vite:test:ci

    - name: Check published types
      run: npm run test:types

    - name: Run integration tests
      run: npm run test:int

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-results-node-${{ matrix.node-version }}
        path: |
          coverage/
        retention-days: 7
