# This workflow runs Playwright e2e tests
# For more information see: https://playwright.dev/docs/ci

name: Playwright

permissions:
  contents: read

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: TEST=1 node build-scripts/build-all.js

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        path: |
          dist/
          js/
          test-js/
        retention-days: 1

  e2e:
    name: E2E ${{ matrix.framework }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        framework:
          - alpine
          # - angular  # TODO: needs @analogjs/vite-plugin-angular setup
          - astro
          - jquery
          - parent
          - react
          - solid
          - svelte
          - vue

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 22.x
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-output

    - name: Build e2e app
      run: bash build-scripts/build-e2e-app.sh ${{ matrix.framework }}

    - name: Run Playwright tests
      run: npx playwright test e2e/tests/${{ matrix.framework }}.spec.js

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-${{ matrix.framework }}
        path: playwright-report/
        retention-days: 30

    - name: Upload test screenshots
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-screenshots-${{ matrix.framework }}
        path: test-results/
        retention-days: 30
