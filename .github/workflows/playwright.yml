# This workflow runs Playwright e2e tests
# For more information see: https://playwright.dev/docs/ci
# Uses local build artifacts (js/ and dist/) for testing

name: Playwright

permissions:
  contents: read

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  test:
    timeout-minutes: 60
    name: Run e2e tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Build project
      run: TEST=1 node build-scripts/build-all.js

    - name: Build React example for e2e tests
      run: |
        cd example/react
        npm install
        for pkg in common core react; do
          rm -rf node_modules/@iframe-resizer/$pkg
          ln -s ../../../../dist/$pkg node_modules/@iframe-resizer/$pkg
        done
        npm run build

    - name: Build Vue example for e2e tests
      run: |
        cd example/vue
        npm install
        for pkg in common core vue; do
          rm -rf node_modules/@iframe-resizer/$pkg
          ln -s ../../../../dist/$pkg node_modules/@iframe-resizer/$pkg
        done
        npm run build

    - name: Replace js-dist with symlink to js for e2e tests
      run: rm -rf js-dist && ln -s js js-dist

    - name: Run Playwright tests
      run: npm run test:e2e

    - name: Unlink dist packages from examples
      if: always()
      run: |
        cd example/react && npm install
        cd ../vue && npm install

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload test screenshots
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-screenshots
        path: test-results/
        retention-days: 30
