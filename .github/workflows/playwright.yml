# This workflow runs Playwright e2e tests
# For more information see: https://playwright.dev/docs/ci

name: Playwright

permissions:
  contents: read

on:
  # dev and dev-review are tested by their open PRs, #1570 and #1729, so a
  # push to them ran every job twice. Add one back here if its PR closes.
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "dev", "dev-review" ]

# A newer commit to a PR cancels its older runs; each push runs in full
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 26.x
        cache: 'npm'

    - name: Use npm 12
      run: npm install -g npm@12

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: TEST=1 node build-scripts/build-all.js

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        path: |
          dist/
          js/
          test/js/
        retention-days: 1

  platform:
    name: ${{ matrix.platform }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # One runner per platform, each running the shared suites through that
        # wrapper. Anything that does not vary by platform is in core.
        platform:
          - alpine
          - angular
          - astro
          - jquery
          - react
          - solid
          - svelte
          - vue
          - web-component

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 26.x
        cache: 'npm'

    - name: Use npm 12
      run: npm install -g npm@12

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        name: build-output

    - name: Build e2e app
      run: bash build-scripts/build-e2e-app.sh ${{ matrix.platform }}

    - name: Run Playwright tests
      run: npx playwright test e2e/tests/${{ matrix.platform }}.spec.js

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-${{ matrix.platform }}
        path: playwright-report/
        retention-days: 30

    - name: Upload test screenshots
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-screenshots-${{ matrix.platform }}
        path: test/results/
        retention-days: 30

  suite:
    name: ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # core: the plain parent and child, and everything that behaves the
        # same whichever wrapper is used. legacy: this release against the
        # earlier ones, in both directions.
        suite:
          - core
          - legacy

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 26.x
        cache: 'npm'

    - name: Use npm 12
      run: npm install -g npm@12

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        name: build-output

    - name: Run Playwright tests
      run: npx playwright test e2e/tests/${{ matrix.suite }}

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report-${{ matrix.suite }}
        path: playwright-report/
        retention-days: 30

    - name: Upload test screenshots
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-screenshots-${{ matrix.suite }}
        path: test/results/
        retention-days: 30
